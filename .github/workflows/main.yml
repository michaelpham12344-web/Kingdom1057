#!/usr/bin/env python3
"""
What does POST /player actually return?

Your redeemer already calls this before every redemption (login(fid)) but throws
the response away. This prints it in full, so we can see whether it carries the
name and kingdom needed to replace the dead kingshot.net lookup.

Host, salt and signing are copied verbatim from your working redeem script —
NOT from worker.js, whose copies are stale.

Run:  python3 probe_player.py 158134757
"""
import hashlib, json, sys, time, urllib.parse, urllib.request

SALT = "mN4!pQs6JrYwV9"
API = "https://kingshot-giftcode.centurygame.com/api"

# Origin/Referer matter for the WAF — same headers the browser sends.
API_HEADERS = {
    "Accept": "application/json, text/plain, */*",
    "Content-Type": "application/x-www-form-urlencoded",
    "Origin": "https://ks-giftcode.centurygame.com",
    "Referer": "https://ks-giftcode.centurygame.com/",
    "User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                   "(KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"),
}


def sign_fields(fields):
    """md5 of params sorted alphabetically by key, joined k=v&..., plus SALT."""
    parts = "&".join(f"{k}={fields[k]}" for k in sorted(fields))
    return hashlib.md5((parts + SALT).encode()).hexdigest()


def player(fid):
    t = int(time.time() * 1000)
    f = {"fid": str(fid), "time": str(t)}
    f["sign"] = sign_fields(f)
    body = urllib.parse.urlencode(f).encode()
    req = urllib.request.Request(API + "/player", data=body,
                                 headers=API_HEADERS, method="POST")
    with urllib.request.urlopen(req, timeout=30) as r:
        return r.status, json.loads(r.read().decode())


def show(fid, label):
    print(f"\n=== {label}: fid={fid} ===")
    try:
        status, data = player(fid)
        print(f"HTTP {status}")
        print(json.dumps(data, indent=2, ensure_ascii=False))
        d = data.get("data") or {}
        if d:
            print("\n  -- fields we care about --")
            for key in ("nickname", "name", "kid", "stove_lv", "stove_lv_content",
                        "avatar_image", "fid", "state", "kingdom"):
                if key in d:
                    print(f"  {key:18} = {d[key]!r}")
            unknown = [k for k in d if k not in
                       ("nickname", "name", "kid", "stove_lv", "stove_lv_content",
                        "avatar_image", "fid", "state", "kingdom")]
            if unknown:
                print(f"  other keys present: {unknown}")
    except Exception as e:
        print(f"FAILED: {e}")


if __name__ == "__main__":
    real = sys.argv[1] if len(sys.argv) > 1 else "158134757"
    show(real, "REAL player")
    # A made-up id: proves the API distinguishes "no such player" from an outage,
    # which is what stops someone claiming an ID that doesn't exist.
    show("999999999999", "NONSENSE id (should be rejected)")
